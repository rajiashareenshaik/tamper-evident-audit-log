spring:
  application:
    name: audit-log-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/auditdb
    username: audit
    password: audit
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

audit:
  retention-window: P365D
  redaction-encryption-key: ${AUDIT_REDACTION_ENCRYPTION_KEY:}
  cryptographic-key: ${AUDIT_CRYPTOGRAPHIC_KEY:local-development-key-change-me}
